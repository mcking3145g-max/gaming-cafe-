name: Apply targeted UI cleanup

on:
  push:
    paths:
      - '.github/workflows/remove-ui-blocks.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove requested UI only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # Remove the full top navigation/header.
          text = re.sub(r'\n<header class="nav-shell">.*?</header>\n', '\n', text, flags=re.S)

          # Remove only the static hero crosshair; keep mouse-dot/mouse-ring cursor.
          text = text.replace('\n  <div class="crosshair"></div>', '')

          # Remove the hero stats strip.
          text = re.sub(r'\n\s*<div class="stats">.*?</div>\n\s*</section>', '\n</section>', text, flags=re.S)

          # Remove menu JS because the navbar no longer exists; otherwise it would stop later JS.
          text = re.sub(
              r"const menu=document\.querySelector\('\.menu'\);\nconst nav=document\.querySelector\('\.navlinks'\);\nmenu\.addEventListener\('click',\(\)=>nav\.classList\.toggle\('open'\)\);\n\ndocument\.querySelectorAll\('\.navlinks a'\)\.forEach\(a=>\{\n\s*a\.addEventListener\('click',\(\)=>nav\.classList\.remove\('open'\)\);\n\}\);\n\n",
              '', text
          )

          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify moving cursor remains
        run: |
          grep -q 'class="mouse-dot"' index.html
          grep -q 'class="mouse-ring"' index.html
          ! grep -q '<div class="crosshair"></div>' index.html
          ! grep -q '<header class="nav-shell">' index.html
          ! grep -q '<div class="stats">' index.html
      - name: Commit cleanup and remove temporary workflow
        run: |
          rm .github/workflows/remove-ui-blocks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove navbar, stats strip and static crosshair"
          git push origin main
