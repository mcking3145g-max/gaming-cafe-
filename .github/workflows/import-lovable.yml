name: Import Lovable premium build

on:
  push:
    paths:
      - '.github/workflows/import-lovable.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Import completed Lovable build
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW='https://id-preview--d59f9a2b-6095-4c94-9d4a-0371e3214bd8.lovable.app'
          PROD='https://demo-premium-gaming-cafe.lovable.app'
          imported=0

          # Prefer the standalone Lovable export if the preview server exposes it.
          for base in "$PREVIEW" "$PROD"; do
            status=$(curl -L --retry 3 --connect-timeout 15 --max-time 90 -sS -w '%{http_code}' -o /tmp/lovable-export.html "$base/static-export.html" || true)
            if [ "$status" = '200' ] && grep -qi 'Play in' /tmp/lovable-export.html && grep -q '0.14' /tmp/lovable-export.html && grep -q 'cursor-ring' /tmp/lovable-export.html; then
              cp /tmp/lovable-export.html index.html
              imported=1
              break
            fi
          done

          # Fallback: use Lovable's deployed page HTML and make its root-relative build assets absolute.
          if [ "$imported" = '0' ]; then
            base="$PREVIEW"
            if curl -fL --retry 3 --connect-timeout 15 --max-time 90 -sS "$PROD/" -o /tmp/lovable-root.html; then
              base="$PROD"
            else
              curl -fL --retry 3 --connect-timeout 15 --max-time 90 -sS "$PREVIEW/" -o /tmp/lovable-root.html
            fi
            BASE="$base" python3 - <<'PY'
          import os, re
          from pathlib import Path

          base = os.environ['BASE'].rstrip('/')
          html = Path('/tmp/lovable-root.html').read_text(encoding='utf-8')

          # Keep the exact Lovable application, but load its compiled assets from the Lovable host.
          html = re.sub(r'(?P<a>\b(?:src|href|poster)=["\'])/(?!/)', lambda m: m.group('a') + base + '/', html)
          html = re.sub(r'(?P<a>\bsrcset=["\'])([^"\']+)', lambda m: m.group('a') + re.sub(r'(?<![\w:])/([^,\s]+)', base + r'/\1', m.group(2)), html)
          Path('index.html').write_text(html, encoding='utf-8')
          PY
          fi

          test -s index.html
          grep -qi 'DEMO' index.html

      - name: Remove temporary importer and commit site
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-lovable.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import Lovable premium gaming cafe build'
          git push origin main
