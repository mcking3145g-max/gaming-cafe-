name: Remove selected site sections

on:
  push:
    paths:
      - '.github/workflows/remove-four-sections.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove requested sections only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # Remove Locations section.
          text = re.sub(r'\n<section class="section" id="locations">.*?</section>\n', '\n', text, count=1, flags=re.S)

          # Remove Console section.
          text = re.sub(r'\n<section class="section" id="console">.*?</section>\n', '\n', text, count=1, flags=re.S)

          # Remove ticker strip.
          text = re.sub(r'\n<div class="ticker">.*?</div>\n\s*</div>\n', '\n', text, count=1, flags=re.S)

          # Remove Arcade / gallery section.
          text = re.sub(r'\n<section class="section" id="arcade">.*?</section>\n', '\n', text, count=1, flags=re.S)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify requested blocks are gone
        run: |
          ! grep -q '<section class="section" id="locations">' index.html
          ! grep -q '<section class="section" id="console">' index.html
          ! grep -q '<div class="ticker">' index.html
          ! grep -q '<section class="section" id="arcade">' index.html
          grep -q 'class="mouse-dot"' index.html
          grep -q 'class="mouse-ring"' index.html
      - name: Commit cleanup and remove temporary workflow
        run: |
          rm .github/workflows/remove-four-sections.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove locations console ticker and gallery sections"
          git push origin main
