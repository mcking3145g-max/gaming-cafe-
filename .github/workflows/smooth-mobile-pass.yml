name: Smooth mobile optimization
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smooth-mobile-pass.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize homepage and booking page
        run: |
          python - <<'PY'
          from pathlib import Path

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing target: {label}')
              return text.replace(old, new, 1)

          # ---- Homepage ----
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = must_replace(
              s,
              '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n',
              '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="preconnect" href="https://videos.pexels.com">\n<link rel="preconnect" href="https://images.unsplash.com">\n',
              'homepage preconnects'
          )

          smooth_css = r'''
/* smooth loading + mobile polish */
body.is-loading{overflow:hidden}.page-loader{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;background:#080808;opacity:1;visibility:visible;transition:opacity .55s ease,visibility .55s ease}.page-loader.hide{opacity:0;visibility:hidden;pointer-events:none}.loader-core{width:min(72vw,19rem);text-align:center}.loader-brand{font:800 1rem/1 var(--display);letter-spacing:.48em;text-indent:.48em;color:#f5f2f1}.loader-track{height:1px;margin-top:1.25rem;overflow:hidden;background:#292525}.loader-track i{display:block;width:40%;height:100%;background:linear-gradient(90deg,transparent,var(--red),var(--cyan),transparent);animation:loaderSweep 1.15s var(--ease) infinite}.loader-note{margin-top:.8rem;color:#6f6966;font:600 .53rem/1 var(--display);letter-spacing:.28em;text-transform:uppercase}@keyframes loaderSweep{from{transform:translateX(-120%)}to{transform:translateX(330%)}}
.reveal{opacity:0;transform:translate3d(0,28px,0);filter:none;transition:opacity .72s ease,transform .9s var(--ease);transition-delay:var(--d,0ms);will-change:opacity,transform}.reveal.show{opacity:1;transform:translate3d(0,0,0);filter:none}.hero-poster{z-index:0;background:linear-gradient(135deg,#080808 5%,#101010 45%,#081516 100%),url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=2200&q=82') center/cover}.hero-video{opacity:0;transition:opacity .7s ease;will-change:opacity,transform}.hero-video.ready{opacity:1}.btn,.tile,.plan,.event,.feature{backface-visibility:hidden;-webkit-tap-highlight-color:transparent}.section{scroll-margin-top:1rem}
@media(max-width:900px){.section{padding:5.75rem 0}.hero-main{padding-bottom:4.75rem}.hero-copy{grid-column:1/12}.hardware{gap:2.75rem}.visual{min-height:24rem}.footer-grid{gap:2.4rem}.plans{gap:1rem}.plan{min-height:0}}
@media(max-width:680px){.wrap{width:min(100% - 1.35rem,92rem)}.grain{display:none}.grid{opacity:.28;background-size:56px 56px}.glow{filter:blur(76px);opacity:.58}.section{padding:4.6rem 0}.hero{min-height:100svh;min-height:760px}.hero-top{padding-top:1.15rem}.brand{font-size:1rem;letter-spacing:.36em}.hero-main{display:block;margin-top:auto;padding-bottom:3.3rem}.hero h1{font-size:clamp(3.25rem,16vw,5.5rem);line-height:.86;letter-spacing:-.055em}.hero-tag{margin-bottom:1rem}.eyebrow{font-size:.59rem;letter-spacing:.32em}.hero-desc{max-width:24rem;margin-top:1.35rem;font-size:.94rem;line-height:1.62;color:#c0b9b6}.hero .actions{display:grid;grid-template-columns:1fr;gap:.7rem;margin-top:1.55rem}.hero .btn{justify-content:center;min-height:3.2rem;width:100%;padding:.95rem 1.1rem}.hero-video{object-position:58% center;transform:scale(1.01);filter:saturate(.78) contrast(1.06) brightness(.52)}.hero-shade{background:linear-gradient(90deg,#080808f2 0%,#080808a8 58%,#08080855 100%),linear-gradient(180deg,#08080850 0%,transparent 28%,#080808f4 92%)}.intro{margin-bottom:2.2rem}.title{margin-top:1rem;font-size:clamp(2.2rem,11vw,3.45rem);line-height:.96}.lead{margin-top:1.1rem;font-size:.94rem;line-height:1.65}.tiles{gap:1px}.tile{min-height:13.5rem;padding:1.35rem}.tile h3{margin-top:3.1rem;font-size:1.4rem}.tile p{font-size:.86rem;line-height:1.55}.hardware{gap:2rem}.visual{min-height:18rem}.specs{margin-top:1.8rem}.spec{padding:1rem}.spec .v{font-size:1.22rem}.feature{grid-template-columns:2.4rem 1fr;padding:1.55rem 0}.feature h3{font-size:1.2rem}.feature p{font-size:.84rem}.plans{margin-top:2.2rem;gap:.85rem}.plan{padding:1.4rem}.price{font-size:2.85rem}.plan .btn{min-height:3.1rem}.event{grid-template-columns:3.1rem 1fr;padding:1.35rem .1rem}.event .go{display:none}.event h3{font-size:1rem;line-height:1.1}.event p{font-size:.78rem;line-height:1.45}.booking .section{padding-block:5.6rem}.booking .actions{display:grid;grid-template-columns:1fr;gap:.7rem}.booking .btn{justify-content:center;width:100%;min-height:3.2rem}.footer-grid{padding:3.6rem 0 2.4rem;gap:2rem}.footer-brand p{font-size:.9rem}.footer-bottom{gap:1rem;padding-bottom:1.5rem}.page-loader .loader-core{width:min(68vw,15rem)}}
@media(max-width:420px){.hero{min-height:720px}.hero h1{font-size:clamp(3rem,17vw,4.8rem)}.hero-desc{font-size:.9rem}.specs{grid-template-columns:1fr}.spec{padding:1.1rem}.event{grid-template-columns:2.8rem 1fr}.footer-bottom .mini-links{flex-wrap:wrap}.btn{letter-spacing:.15em}}
'''
          marker = '@media(prefers-reduced-motion:reduce)'
          if marker not in s:
              raise SystemExit('Homepage reduced-motion marker missing')
          s = s.replace(marker, smooth_css + '\n' + marker, 1)

          s = must_replace(
              s,
              '<body>\n<div class="grain" aria-hidden="true"></div>',
              '<body class="is-loading">\n<div class="page-loader" id="pageLoader" aria-hidden="true"><div class="loader-core"><div class="loader-brand">DEMO</div><div class="loader-track"><i></i></div><div class="loader-note">Entering the floor</div></div></div>\n<div class="grain" aria-hidden="true"></div>',
              'homepage loader markup'
          )

          old_video_js = """const heroVideo=document.querySelector('#heroVideo');\nif(heroVideo){heroVideo.muted=true;heroVideo.setAttribute('muted','');heroVideo.setAttribute('playsinline','');const startHeroVideo=()=>heroVideo.play().catch(()=>{});if(heroVideo.readyState>=2) startHeroVideo();else heroVideo.addEventListener('canplay',startHeroVideo,{once:true});window.addEventListener('load',startHeroVideo,{once:true});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&heroVideo.paused) startHeroVideo()});}\nconst all=document.querySelectorAll('.reveal');if('IntersectionObserver'in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('show');io.unobserve(e.target)}}),{threshold:.11,rootMargin:'0px 0px -6% 0px'});all.forEach(e=>io.observe(e))}else all.forEach(e=>e.classList.add('show'));"""
          new_video_js = """const loader=document.querySelector('#pageLoader');let loaderHidden=false;const hideLoader=()=>{if(loaderHidden)return;loaderHidden=true;document.body.classList.remove('is-loading');if(loader){loader.classList.add('hide');setTimeout(()=>loader.remove(),650)}};\nconst heroVideo=document.querySelector('#heroVideo');\nif(heroVideo){heroVideo.muted=true;heroVideo.setAttribute('muted','');heroVideo.setAttribute('playsinline','');const markReady=()=>{heroVideo.classList.add('ready');hideLoader()};const startHeroVideo=()=>heroVideo.play().catch(()=>{});heroVideo.addEventListener('playing',markReady,{once:true});if(heroVideo.readyState>=2){heroVideo.classList.add('ready');startHeroVideo()}else heroVideo.addEventListener('canplay',()=>{heroVideo.classList.add('ready');startHeroVideo()},{once:true});window.addEventListener('load',()=>{startHeroVideo();setTimeout(hideLoader,260)},{once:true});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&heroVideo.paused) startHeroVideo()})}else{window.addEventListener('load',hideLoader,{once:true})}setTimeout(hideLoader,1800);\nconst all=document.querySelectorAll('.reveal');if('IntersectionObserver'in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('show');io.unobserve(e.target)}}),{threshold:.08,rootMargin:'0px 0px -4% 0px'});all.forEach(e=>io.observe(e))}else all.forEach(e=>e.classList.add('show'));"""
          s = must_replace(s, old_video_js, new_video_js, 'homepage loading JS')
          p.write_text(s, encoding='utf-8')

          # ---- Booking page ----
          p = Path('booking.html')
          b = p.read_text(encoding='utf-8')
          booking_css = r'''
/* mobile + performance polish */
body{overflow-x:hidden;animation:bookingIn .45s ease both}@keyframes bookingIn{from{opacity:0}to{opacity:1}}button,.input,.zone,.slot{touch-action:manipulation;-webkit-tap-highlight-color:transparent}.input{font-size:16px}
@media(max-width:650px){.wrap{width:min(100% - 1.25rem,86rem)}.grain{display:none}.grid{opacity:.28;background-size:56px 56px}.topbar{padding:1.15rem 0}.brand{font-size:1rem;letter-spacing:.35em}.back{font-size:.58rem;letter-spacing:.15em}.page-head{padding:3.2rem 0 2rem}.page-head h1{font-size:clamp(2.7rem,15vw,4.35rem);line-height:.9}.eyebrow{font-size:.58rem;letter-spacing:.32em}.sub{margin-top:1rem;font-size:.92rem;line-height:1.58}.progress{margin-top:1.6rem}.booking-layout{gap:1rem;padding-bottom:4.5rem}.panel{backdrop-filter:none;box-shadow:0 20px 50px #0006}.form-panel{padding:1rem}.step{padding:1.4rem 0}.step-head{gap:.75rem;margin-bottom:1rem}.step h2{font-size:.92rem;line-height:1.2}.zones{gap:.7rem}.zone{padding:1rem}.zone h3{font-size:.98rem}.zone p{font-size:.78rem}.fields{gap:.8rem}.input{height:3.35rem;padding:0 .85rem}.slots{gap:.55rem}.slot{min-height:3rem;padding:.8rem .45rem}.summary{padding:1rem}.summary-hero{margin-top:1rem;padding:1rem}.summary-hero h3{font-size:1.25rem}.row{font-size:.82rem}.total strong{font-size:1.8rem}.btn{min-height:3.25rem}.trust{gap:.5rem}.trust div{padding:.65rem .45rem}.success{padding:.9rem}.success-card{padding:1.4rem}.success h2{font-size:1.6rem}.foot{padding-bottom:1.5rem}}
@media(max-width:390px){.slots{grid-template-columns:1fr 1fr}.zone.active:after{font-size:.46rem}.page-head h1{font-size:2.75rem}.summary-rows .row{gap:.5rem}.trust{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){body{animation:none!important}*,*:before,*:after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
'''
          b = must_replace(b, '</style>', booking_css + '\n</style>', 'booking CSS insert')
          p.write_text(b, encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/smooth-mobile-pass.yml
      - name: Commit optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html booking.html .github/workflows/smooth-mobile-pass.yml
          git commit -m "Polish loading performance and mobile layouts"
          git push
