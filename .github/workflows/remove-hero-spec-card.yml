name: Remove hero spec card
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-hero-spec-card.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove 360Hz hero card
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          target = '    <div class="spec-float reveal" style="--d:600ms"><div class="mini-card"><div class="hairline"></div><div class="big">360Hz</div><p>every screen, every seat — no budget row</p><div class="cap">Spec floor</div></div></div>\n'
          if target not in s:
              raise SystemExit('Hero spec card not found')
          p.write_text(s.replace(target, '', 1), encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/remove-hero-spec-card.yml
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/remove-hero-spec-card.yml
          git commit -m "Remove 360Hz hero spec card"
          git push
